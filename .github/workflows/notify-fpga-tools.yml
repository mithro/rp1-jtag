name: Notify fpgas.online-fpga-tools

# fpgas-online/fpgas.online-fpga-tools builds the packages and static binaries
# that carry this repository's drivers. Its upstreams.toml pins this repository
# by commit, and its daily bump (05:23 UTC) moves that pin to main's head on
# its own -- so a change here reaches the fleet within a day whether or not
# this workflow runs. What the dispatch buys is the same rebuild today rather
# than tomorrow.
#
# Requires the repository secret FPGA_TOOLS_DISPATCH_TOKEN: a fine-grained
# token scoped to that one repository, with Contents: write (to dispatch) and
# Actions: read (to confirm a run started).
#
# This job FAILS when it cannot notify, deliberately. It used to warn and pass,
# which meant a green check reported success while no credential existed and
# nothing was sent -- the one outcome that hides the problem it exists to
# report.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: repository_dispatch rp1jtag-updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tell the distribution repository to rebuild
        env:
          GH_TOKEN: ${{ secrets.FPGA_TOOLS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: uv run .github/scripts/notify_fpga_tools.py
